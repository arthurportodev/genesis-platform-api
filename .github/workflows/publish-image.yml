name: Publish production image

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA already merged into main and approved by its Gate
        required: true
        type: string

concurrency:
  group: publish-production-image
  cancel-in-progress: false

jobs:
  publish:
    name: Scan, publish, and attest approved image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production-image-publication
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      SOURCE_SHA: ${{ inputs.commit_sha }}
      PRODUCTION_IMAGE: genesis-platform-api:publication-candidate
      SBOM_PATH: genesis-platform-api.spdx.json
      SCAN_PATH: grype-report.json
      IMAGE_METADATA_PATH: production-image-inspect.json
      ENVIRONMENT_EVIDENCE_PATH: .codex/task-packets/0.8.2-environment.json
      RISK_ACCEPTANCE_PATH: security/risk-acceptances/0.8.2-f014-v2.json
      POLICY_EVIDENCE_PATH: .codex/task-packets/0.8.2-vulnerability-policy.json
      RUNTIME_FILESYSTEM_EVIDENCE_PATH: .codex/task-packets/0.8.2-runtime-filesystem.json
      EVIDENCE_HASHES_PATH: .codex/task-packets/0.8.2-evidence.sha256

    steps:
      - name: Validate full commit SHA input
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout approved commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Require commit already merged into remote main
        run: |
          git fetch --no-tags origin main
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and validate production dependencies
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Resolve immutable OCI metadata
        run: |
          echo "OCI_CREATED=$(git show -s --format=%cI "$SOURCE_SHA")" >> "$GITHUB_ENV"
          echo "OCI_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build approved Linux image once
        run: >-
          docker buildx build
          --platform linux/amd64
          --target runtime
          --load
          --tag "$PRODUCTION_IMAGE"
          --build-arg OCI_REVISION="$SOURCE_SHA"
          --build-arg OCI_VERSION="$OCI_VERSION"
          --build-arg OCI_CREATED="$OCI_CREATED"
          .

      - name: Generate SPDX JSON SBOM from final image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0, Syft 1.42.3
        with:
          image: genesis-platform-api:publication-candidate
          format: spdx-json
          output-file: genesis-platform-api.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan final image with Grype before publication
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: genesis-platform-api:publication-candidate
          fail-build: false
          only-fixed: false
          output-format: json
          output-file: grype-report.json
          config: .grype.yaml

      - name: Preserve immutable image metadata
        if: always()
        run: docker image inspect "$PRODUCTION_IMAGE" > "$IMAGE_METADATA_PATH"

      - name: Verify hardened runtime before publication
        run: npm run image:verify

      - name: Verify environmental evidence contract
        if: always()
        run: >-
          npm run environment:evidence:verify --
          "$ENVIRONMENT_EVIDENCE_PATH"

      - name: Apply vulnerability publication policy
        if: always()
        run: >-
          node scripts/verify-vulnerability-policy.cjs
          --image "$PRODUCTION_IMAGE"
          --sbom "$SBOM_PATH"
          --scan "$SCAN_PATH"
          --acceptance "$RISK_ACCEPTANCE_PATH"
          --environment-evidence "$ENVIRONMENT_EVIDENCE_PATH"
          --output "$POLICY_EVIDENCE_PATH"
          --mode publication

      - name: Hash preserved evidence
        if: always()
        run: |
          mkdir -p "$(dirname "$EVIDENCE_HASHES_PATH")"
          for artifact in "$SBOM_PATH" "$SCAN_PATH" "$IMAGE_METADATA_PATH" "$RUNTIME_FILESYSTEM_EVIDENCE_PATH" "$ENVIRONMENT_EVIDENCE_PATH" "$POLICY_EVIDENCE_PATH"; do
            if test -f "$artifact"; then sha256sum "$artifact"; fi
          done > "$EVIDENCE_HASHES_PATH"

      - name: Upload raw scanner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-image-publication-raw-${{ env.SOURCE_SHA }}
          path: |
            genesis-platform-api.spdx.json
            grype-report.json
            production-image-inspect.json
            .codex/task-packets/0.8.2-evidence.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Upload policy and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-image-publication-policy-${{ env.SOURCE_SHA }}
          path: |
            .codex/task-packets/0.8.2-runtime-filesystem.json
            .codex/task-packets/0.8.2-environment.json
            .codex/task-packets/0.8.2-vulnerability-policy.json
            .codex/task-packets/0.8.2-evidence.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Authenticate to GHCR only after successful verification
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the exact scanned local image
        id: publish
        run: |
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/genesis-platform-api:sha-$SOURCE_SHA"
          docker tag "$PRODUCTION_IMAGE" "$IMAGE_REF"
          docker push "$IMAGE_REF"
          REPO_DIGEST=$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REF")
          DIGEST="${REPO_DIGEST#*@}"
          test "$DIGEST" != "$REPO_DIGEST"
          echo "image=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance for the published digest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM for the same published digest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: genesis-platform-api.spdx.json
          push-to-registry: true
          create-storage-record: false
