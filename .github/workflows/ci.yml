name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:17-alpine@sha256:af194ccf3e2d7fe367012c7b88ce8b816c5c889b18a5b316799a1f0d7eac746a
        env:
          POSTGRES_DB: genesis_platform_test
          POSTGRES_USER: genesis_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U genesis_test -d genesis_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_HOST: localhost
      TEST_DATABASE_PORT: 5433
      TEST_DATABASE_NAME: genesis_platform_test
      TEST_DATABASE_USER: genesis_test
      TEST_DATABASE_PASSWORD: test-only
      DATABASE_HOST: localhost
      DATABASE_PORT: 5433
      DATABASE_NAME: genesis_platform_test
      DATABASE_USER: genesis_runtime_test
      DATABASE_PASSWORD: runtime-test-only
      DATABASE_RUNTIME_ROLE: genesis_runtime_test
      DATABASE_MIGRATION_USER: genesis_test
      DATABASE_MIGRATION_PASSWORD: test-only
      PRODUCTION_IMAGE: genesis-platform-api:ci
      SBOM_PATH: genesis-platform-api.spdx.json
      SCAN_PATH: grype-report.json
      IMAGE_METADATA_PATH: production-image-inspect.json
      ENVIRONMENT_EVIDENCE_PATH: .codex/task-packets/0.8.2-environment.json
      RISK_ACCEPTANCE_PATH: security/risk-acceptances/0.8.2-f014-v2.json
      POLICY_EVIDENCE_PATH: .codex/task-packets/0.8.2-vulnerability-policy.json
      RUNTIME_FILESYSTEM_EVIDENCE_PATH: .codex/task-packets/0.8.2-runtime-filesystem.json
      EVIDENCE_HASHES_PATH: .codex/task-packets/0.8.2-evidence.sha256

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve and verify source SHA
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            SOURCE_SHA="$PR_HEAD_SHA"
          else
            SOURCE_SHA="$EVENT_SHA"
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source SHA must be a full lowercase commit SHA" >&2
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"
          CHECKOUT_TREE="$(git rev-parse HEAD^{tree})"
          SOURCE_TREE="$(git rev-parse "$SOURCE_SHA^{tree}")"
          if [[ "$CHECKOUT_TREE" != "$SOURCE_TREE" ]]; then
            echo "checkout tree does not match source SHA tree" >&2
            exit 1
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_TREE=$SOURCE_TREE" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Display runtime versions
        run: |
          node --version
          npm --version
          docker version
          docker buildx version
          node -e "if (process.versions.node !== '24.18.0') process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Validate development-operation contracts
        run: npm run task:contracts

      - name: Check task-tool formatting
        run: npm run format:check:task-tools

      - name: Run task-tool tests
        run: npm run test:task-tools

      - name: Run production-tool tests
        run: npm run test:production-tools

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm run test -- --runInBand

      - name: Run E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Run integration tests
        run: npm run test:integration

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Resolve immutable OCI metadata
        run: |
          echo "OCI_CREATED=$(git show -s --format=%cI "$SOURCE_SHA")" >> "$GITHUB_ENV"
          echo "OCI_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build Linux production image without push
        run: >-
          docker buildx build
          --platform linux/amd64
          --target runtime
          --load
          --tag "$PRODUCTION_IMAGE"
          --build-arg OCI_REVISION="$SOURCE_SHA"
          --build-arg OCI_VERSION="$OCI_VERSION"
          --build-arg OCI_CREATED="$OCI_CREATED"
          .

      - name: Generate SPDX JSON SBOM from final image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0, Syft 1.42.3
        with:
          image: genesis-platform-api:ci
          format: spdx-json
          output-file: genesis-platform-api.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan final image with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: genesis-platform-api:ci
          fail-build: false
          only-fixed: false
          output-format: json
          output-file: grype-report.json
          config: .grype.yaml

      - name: Preserve immutable image metadata
        if: always()
        run: docker image inspect "$PRODUCTION_IMAGE" > "$IMAGE_METADATA_PATH"

      - name: Verify hardened Linux runtime
        run: npm run image:verify

      - name: Verify environmental evidence contract
        if: always()
        run: >-
          npm run environment:evidence:verify --
          "$ENVIRONMENT_EVIDENCE_PATH"

      - name: Apply vulnerability risk policy
        if: always()
        run: >-
          node scripts/verify-vulnerability-policy.cjs
          --image "$PRODUCTION_IMAGE"
          --sbom "$SBOM_PATH"
          --scan "$SCAN_PATH"
          --acceptance "$RISK_ACCEPTANCE_PATH"
          --environment-evidence "$ENVIRONMENT_EVIDENCE_PATH"
          --output "$POLICY_EVIDENCE_PATH"
          --mode ci-validation

      - name: Hash preserved evidence
        if: always()
        run: |
          mkdir -p "$(dirname "$EVIDENCE_HASHES_PATH")"
          for artifact in "$SBOM_PATH" "$SCAN_PATH" "$IMAGE_METADATA_PATH" "$RUNTIME_FILESYSTEM_EVIDENCE_PATH" "$ENVIRONMENT_EVIDENCE_PATH" "$POLICY_EVIDENCE_PATH"; do
            if test -f "$artifact"; then sha256sum "$artifact"; fi
          done > "$EVIDENCE_HASHES_PATH"

      - name: Upload raw scanner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-image-raw-scan-${{ env.SOURCE_SHA }}
          path: |
            genesis-platform-api.spdx.json
            grype-report.json
            production-image-inspect.json
            .codex/task-packets/0.8.2-evidence.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Upload policy and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-image-policy-${{ env.SOURCE_SHA }}
          path: |
            .codex/task-packets/0.8.2-runtime-filesystem.json
            .codex/task-packets/0.8.2-environment.json
            .codex/task-packets/0.8.2-vulnerability-policy.json
            .codex/task-packets/0.8.2-evidence.sha256
          if-no-files-found: warn
          retention-days: 30
