name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate backend and production contracts
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: genesis_platform_test
          POSTGRES_USER: genesis_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U genesis_test -d genesis_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_HOST: localhost
      TEST_DATABASE_PORT: 5433
      TEST_DATABASE_NAME: genesis_platform_test
      TEST_DATABASE_USER: genesis_test
      TEST_DATABASE_PASSWORD: test-only
      DATABASE_HOST: localhost
      DATABASE_PORT: 5433
      DATABASE_NAME: genesis_platform_test
      DATABASE_USER: genesis_runtime_test
      DATABASE_PASSWORD: runtime-test-only
      DATABASE_RUNTIME_ROLE: genesis_runtime_test
      DATABASE_MIGRATION_USER: genesis_test
      DATABASE_MIGRATION_PASSWORD: test-only

    steps:
      - name: Initialize synthetic production paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'PRODUCTION_CI_ROOT=%s\n' "$RUNNER_TEMP/genesis-production-ci"
            printf 'PRODUCTION_CI_ENV_FILE=%s\n' "$RUNNER_TEMP/genesis-production-ci/production.env"
            printf 'PRODUCTION_CI_SECRET_DIR=%s\n' "$RUNNER_TEMP/genesis-production-ci/secrets"
            printf 'PRODUCTION_CI_OVERRIDE_FILE=%s\n' "$RUNNER_TEMP/genesis-production-ci/secret-files.override.yml"
            printf 'PRODUCTION_CI_RENDER_FILE=%s\n' "$RUNNER_TEMP/genesis-production-ci/rendered.json"
          } >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Display runtime versions
        run: |
          node --version
          npm --version
          node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Validate development-operation contracts
        run: npm run task:contracts

      - name: Check task-tool formatting
        run: npm run format:check:task-tools

      - name: Run task-tool tests
        run: npm run test:task-tools

      - name: Validate canonical project memory
        run: node scripts/validate-project-memory.cjs --mode local

      - name: Run canonical project-memory tests
        run: node --test test/project-memory/project-memory.test.cjs

      - name: Validate CI workflow contract
        run: npm run ci:contract:validate

      - name: Check CI workflow formatting
        run: npm run format:check:ci

      - name: Run CI workflow contract tests
        run: npm run test:ci

      - name: Check production surface formatting
        run: npm run format:check:production

      - name: Create synthetic production Compose inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$PRODUCTION_CI_ROOT" "$PRODUCTION_CI_SECRET_DIR"
          cat > "$PRODUCTION_CI_ENV_FILE" <<'ENV'
          DATABASE_NAME=genesis_platform
          DATABASE_BOOTSTRAP_USER=genesis_bootstrap
          DATABASE_MIGRATION_USER=genesis_migration
          DATABASE_RUNTIME_ROLE=genesis_runtime
          APP_NAME=Genesis Platform API
          APP_VERSION=0.1.0
          ACME_EMAIL=acme-contact-required@genesis.invalid
          TRUST_PROXY_HOPS=1
          JWT_ACCESS_EXPIRES_IN=15m
          REFRESH_TOKEN_EXPIRES_IN_DAYS=30
          LEAD_IDEMPOTENCY_KEY_CURRENT_VERSION=1
          API_CPUS=0.75
          API_MEMORY_LIMIT=1g
          API_PIDS_LIMIT=128
          API_NODE_MAX_OLD_SPACE_MB=640
          MIGRATE_CPUS=0.75
          MIGRATE_MEMORY_LIMIT=1g
          MIGRATE_PIDS_LIMIT=128
          MIGRATE_NODE_MAX_OLD_SPACE_MB=640
          POSTGRES_CPUS=1.0
          POSTGRES_MEMORY_LIMIT=2g
          POSTGRES_PIDS_LIMIT=256
          ENV
          printf '%s\n' 'synthetic-ci-bootstrap-password-only' > "$PRODUCTION_CI_SECRET_DIR/postgres-bootstrap-password"
          printf '%s\n' 'synthetic-ci-migration-password-only' > "$PRODUCTION_CI_SECRET_DIR/database-migration-password"
          printf '%s\n' 'synthetic-ci-runtime-password-only' > "$PRODUCTION_CI_SECRET_DIR/database-runtime-password"
          printf '%s\n' 'synthetic-ci-jwt-access-secret-at-least-32-characters' > "$PRODUCTION_CI_SECRET_DIR/jwt-access-secret"
          printf '%s\n' 'synthetic-ci-refresh-pepper-at-least-32-characters' > "$PRODUCTION_CI_SECRET_DIR/refresh-token-pepper"
          printf '%s\n' 'synthetic-ci-lead-idempotency-keyring-only' > "$PRODUCTION_CI_SECRET_DIR/lead-idempotency-keys"
          chmod 0600 \
            "$PRODUCTION_CI_SECRET_DIR/postgres-bootstrap-password" \
            "$PRODUCTION_CI_SECRET_DIR/database-migration-password" \
            "$PRODUCTION_CI_SECRET_DIR/database-runtime-password" \
            "$PRODUCTION_CI_SECRET_DIR/jwt-access-secret" \
            "$PRODUCTION_CI_SECRET_DIR/refresh-token-pepper" \
            "$PRODUCTION_CI_SECRET_DIR/lead-idempotency-keys"
          cat > "$PRODUCTION_CI_OVERRIDE_FILE" <<OVERRIDE
          secrets:
            postgres_bootstrap_password:
              file: $PRODUCTION_CI_SECRET_DIR/postgres-bootstrap-password
            database_migration_password:
              file: $PRODUCTION_CI_SECRET_DIR/database-migration-password
            database_runtime_password:
              file: $PRODUCTION_CI_SECRET_DIR/database-runtime-password
            jwt_access_secret:
              file: $PRODUCTION_CI_SECRET_DIR/jwt-access-secret
            refresh_token_pepper:
              file: $PRODUCTION_CI_SECRET_DIR/refresh-token-pepper
            lead_idempotency_keys:
              file: $PRODUCTION_CI_SECRET_DIR/lead-idempotency-keys
          OVERRIDE

      - name: Validate synthetic secret-backed production render
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --env-file "$PRODUCTION_CI_ENV_FILE" \
            -f compose.production.yml \
            -f "$PRODUCTION_CI_OVERRIDE_FILE" \
            config --format json > "$PRODUCTION_CI_RENDER_FILE"
          node <<'NODE'
          const { readFileSync, statSync } = require('node:fs');
          const { join } = require('node:path');
          const config = JSON.parse(readFileSync(process.env.PRODUCTION_CI_RENDER_FILE, 'utf8'));
          const apiImage = 'ghcr.io/arthurportodev/genesis-platform-api@sha256:56ada3e6bea3ab96b0bbb77fa456b8107663f92e82f8724ea05cb04d8b5cf659';
          const postgresImage = 'postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193';
          if (config.services.api.image !== apiImage || config.services.migrate.image !== apiImage) throw new Error('synthetic API image mismatch');
          if (config.services.postgres.image !== postgresImage) throw new Error('synthetic PostgreSQL image mismatch');
          if (config.services.api.environment.FRONTEND_URL !== 'https://app.agenciagenesismkt.com.br') throw new Error('synthetic frontend mismatch');
          if (String(config.services.api.environment.LEAD_IDEMPOTENCY_KEY_CURRENT_VERSION) !== '1') throw new Error('synthetic Lead key version mismatch');
          const roles = [
            config.services.postgres.environment.POSTGRES_USER,
            config.services.postgres.environment.DATABASE_MIGRATION_USER,
            config.services.postgres.environment.DATABASE_RUNTIME_ROLE,
          ];
          if (roles.some((role) => !/^[a-z_][a-z0-9_]*$/.test(role)) || new Set(roles).size !== 3) throw new Error('synthetic database roles are invalid');
          const secretFiles = {
            postgres_bootstrap_password: 'postgres-bootstrap-password',
            database_migration_password: 'database-migration-password',
            database_runtime_password: 'database-runtime-password',
            jwt_access_secret: 'jwt-access-secret',
            refresh_token_pepper: 'refresh-token-pepper',
            lead_idempotency_keys: 'lead-idempotency-keys',
          };
          for (const [name, filename] of Object.entries(secretFiles)) {
            const expected = join(process.env.PRODUCTION_CI_SECRET_DIR, filename);
            if (config.secrets?.[name]?.file !== expected) throw new Error(`synthetic secret path mismatch: ${name}`);
            if ((statSync(expected).mode & 0o777) !== 0o600) throw new Error(`synthetic secret mode mismatch: ${name}`);
            const value = readFileSync(expected, 'utf8').trim();
            if (!value.startsWith('synthetic-ci-')) throw new Error(`synthetic secret marker mismatch: ${name}`);
          }
          NODE

      - name: Validate production Compose with Docker
        run: npm run production:compose:validate
        env:
          GENESIS_PRODUCTION_ENV_FILE: ${{ env.PRODUCTION_CI_ENV_FILE }}

      - name: Remove synthetic production Compose inputs
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f -- \
            "$PRODUCTION_CI_RENDER_FILE" \
            "$PRODUCTION_CI_OVERRIDE_FILE" \
            "$PRODUCTION_CI_ENV_FILE" \
            "$PRODUCTION_CI_SECRET_DIR/postgres-bootstrap-password" \
            "$PRODUCTION_CI_SECRET_DIR/database-migration-password" \
            "$PRODUCTION_CI_SECRET_DIR/database-runtime-password" \
            "$PRODUCTION_CI_SECRET_DIR/jwt-access-secret" \
            "$PRODUCTION_CI_SECRET_DIR/refresh-token-pepper" \
            "$PRODUCTION_CI_SECRET_DIR/lead-idempotency-keys"
          if [ -d "$PRODUCTION_CI_SECRET_DIR" ]; then
            rmdir -- "$PRODUCTION_CI_SECRET_DIR"
          fi
          if [ -d "$PRODUCTION_CI_ROOT" ]; then
            rmdir -- "$PRODUCTION_CI_ROOT"
          fi

      - name: Run focused production tests
        run: npm run test:production

      - name: Validate recovery contract
        run: npm run recovery:validate

      - name: Check recovery formatting
        run: npm run format:check:recovery

      - name: Run recovery unit and adversarial tests
        run: sudo env "PATH=$PATH" npm run test:recovery

      - name: Run isolated recovery integration
        run: npm run test:recovery:integration

      - name: Check application formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm run test -- --runInBand

      - name: Run E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Run integration tests
        run: npm run test:integration

  image-impact:
    name: Detect production image impact
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}

    steps:
      - name: Checkout complete push history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Detect image-affecting paths
        id: detect
        env:
          IMAGE_IMPACT_BASE_SHA: ${{ github.event.before }}
          IMAGE_IMPACT_HEAD_SHA: ${{ github.sha }}
        run: node scripts/detect-image-impact.cjs --base "$IMAGE_IMPACT_BASE_SHA" --head "$IMAGE_IMPACT_HEAD_SHA"

  build-and-scan:
    name: Build and scan production image
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: validate
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      IMAGE_REF: ghcr.io/arthurportodev/genesis-platform-api:sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Read image identity
        id: identity
        shell: bash
        run: |
          node -e "const p=require('./package.json'); console.log('title='+p.name); console.log('description='+p.description); console.log('created='+new Date().toISOString())" >> "$GITHUB_OUTPUT"

      - name: Generate immutable image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/arthurportodev/genesis-platform-api
          flavor: latest=false
          tags: type=raw,value=sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.created=${{ steps.identity.outputs.created }}
            org.opencontainers.image.title=${{ steps.identity.outputs.title }}
            org.opencontainers.image.description=${{ steps.identity.outputs.description }}

      - name: Build one local production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: production
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          provenance: false
          sbom: false

      - name: Verify local image identity
        shell: bash
        run: |
          docker image inspect "$IMAGE_REF" > "${{ runner.temp }}/local-image.json"
          IMAGE_JSON="${{ runner.temp }}/local-image.json" node <<'NODE'
          const { readFileSync } = require('node:fs');
          const [image] = JSON.parse(readFileSync(process.env.IMAGE_JSON, 'utf8'));
          const labels = image?.Config?.Labels ?? {};
          const packageJson = require('./package.json');
          const expected = {
            'org.opencontainers.image.source': `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`,
            'org.opencontainers.image.revision': process.env.GITHUB_SHA,
            'org.opencontainers.image.version': `sha-${process.env.GITHUB_SHA}`,
            'org.opencontainers.image.title': packageJson.name,
            'org.opencontainers.image.description': packageJson.description,
          };
          if (image?.Os !== 'linux' || image?.Architecture !== 'amd64') throw new Error('local image platform mismatch');
          for (const [key, value] of Object.entries(expected)) if (labels[key] !== value) throw new Error(`local image label mismatch: ${key}`);
          if (Number.isNaN(Date.parse(labels['org.opencontainers.image.created']))) throw new Error('local image created label is invalid');
          NODE

      - name: Validate local production runtime
        env:
          PRODUCTION_IMAGE_UNDER_TEST: ${{ env.IMAGE_REF }}
        run: node --test test/production/production-image.test.cjs

      - name: Scan local production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          scanners: vuln
          severity: CRITICAL
          version: v0.70.0
          cache: false

  publish-image:
    name: Publish verified immutable image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - validate
      - image-impact
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.image-impact.result == 'success' && needs.image-impact.outputs.should_publish == 'true' }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      IMAGE_REPOSITORY: ghcr.io/arthurportodev/genesis-platform-api
      IMAGE_TAG: sha-${{ github.sha }}
      IMAGE_REF: ghcr.io/arthurportodev/genesis-platform-api:sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Read image identity
        id: identity
        shell: bash
        run: |
          node -e "const p=require('./package.json'); console.log('title='+p.name); console.log('description='+p.description); console.log('created='+new Date().toISOString())" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine whether immutable tag exists
        id: existence
        shell: bash
        run: |
          set +e
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}' > "${{ runner.temp }}/existing-manifest.json" 2> "${{ runner.temp }}/existing-error.txt"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest unknown|name unknown|no such manifest|ghcr\.io/arthurportodev/genesis-platform-api.*not found' "${{ runner.temp }}/existing-error.txt"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Registry inspection failed with an unclassified error." >&2
            exit "$status"
          fi

      - name: Validate existing image identity
        id: existing
        if: ${{ steps.existence.outputs.exists == 'true' }}
        shell: bash
        run: |
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}' > "${{ runner.temp }}/remote-descriptor.json"
          docker buildx imagetools inspect "$IMAGE_REF" --raw > "${{ runner.temp }}/remote-manifest.json"
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Image}}' > "${{ runner.temp }}/remote-image.json"
          REMOTE_DESCRIPTOR_JSON="${{ runner.temp }}/remote-descriptor.json" REMOTE_MANIFEST_JSON="${{ runner.temp }}/remote-manifest.json" REMOTE_IMAGE_JSON="${{ runner.temp }}/remote-image.json" node <<'NODE' > "${{ runner.temp }}/immutable-ref.txt"
          const { readFileSync } = require('node:fs');
          const descriptor = JSON.parse(readFileSync(process.env.REMOTE_DESCRIPTOR_JSON, 'utf8'));
          const manifest = JSON.parse(readFileSync(process.env.REMOTE_MANIFEST_JSON, 'utf8'));
          const image = JSON.parse(readFileSync(process.env.REMOTE_IMAGE_JSON, 'utf8'));
          const labels = image?.config?.Labels ?? {};
          const packageJson = require('./package.json');
          const expected = {
            'org.opencontainers.image.source': `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`,
            'org.opencontainers.image.revision': process.env.GITHUB_SHA,
            'org.opencontainers.image.version': `sha-${process.env.GITHUB_SHA}`,
            'org.opencontainers.image.title': packageJson.name,
            'org.opencontainers.image.description': packageJson.description,
          };
          if (!/^sha256:[a-f0-9]{64}$/.test(descriptor?.digest ?? '')) throw new Error('existing image manifest digest identity is invalid');
          if (!/^sha256:[a-f0-9]{64}$/.test(manifest?.config?.digest ?? '')) throw new Error('existing image config identity is invalid');
          if (image?.os !== 'linux' || image?.architecture !== 'amd64') throw new Error('existing image platform mismatch');
          for (const [key, value] of Object.entries(expected)) if (labels[key] !== value) throw new Error(`existing image label mismatch: ${key}`);
          if (Number.isNaN(Date.parse(labels['org.opencontainers.image.created']))) throw new Error('existing image created label is invalid');
          process.stdout.write(`${process.env.IMAGE_REPOSITORY}@${descriptor.digest}\n${manifest.config.digest}`);
          NODE
          mapfile -t existing_identity < "${{ runner.temp }}/immutable-ref.txt"
          if [ "${#existing_identity[@]}" -ne 2 ]; then
            echo "Existing image identity is incomplete." >&2
            exit 1
          fi
          immutable_ref="${existing_identity[0]%$'\r'}"
          config_digest="${existing_identity[1]%$'\r'}"
          echo "immutable_ref=$immutable_ref" >> "$GITHUB_OUTPUT"
          echo "config_digest=$config_digest" >> "$GITHUB_OUTPUT"

      - name: Generate immutable image metadata
        id: meta
        if: ${{ steps.existence.outputs.exists == 'false' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/arthurportodev/genesis-platform-api
          flavor: latest=false
          tags: type=raw,value=sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.created=${{ steps.identity.outputs.created }}
            org.opencontainers.image.title=${{ steps.identity.outputs.title }}
            org.opencontainers.image.description=${{ steps.identity.outputs.description }}

      - name: Build one local production image
        if: ${{ steps.existence.outputs.exists == 'false' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: production
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          provenance: false
          sbom: false

      - name: Verify new local image identity
        id: local
        if: ${{ steps.existence.outputs.exists == 'false' }}
        shell: bash
        run: |
          docker image inspect "$IMAGE_REF" > "${{ runner.temp }}/local-image.json"
          IMAGE_JSON="${{ runner.temp }}/local-image.json" node <<'NODE'
          const { readFileSync } = require('node:fs');
          const [image] = JSON.parse(readFileSync(process.env.IMAGE_JSON, 'utf8'));
          const labels = image?.Config?.Labels ?? {};
          const packageJson = require('./package.json');
          const expected = {
            'org.opencontainers.image.source': `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`,
            'org.opencontainers.image.revision': process.env.GITHUB_SHA,
            'org.opencontainers.image.version': `sha-${process.env.GITHUB_SHA}`,
            'org.opencontainers.image.title': packageJson.name,
            'org.opencontainers.image.description': packageJson.description,
          };
          if (image?.Os !== 'linux' || image?.Architecture !== 'amd64') throw new Error('new image platform mismatch');
          for (const [key, value] of Object.entries(expected)) if (labels[key] !== value) throw new Error(`new image label mismatch: ${key}`);
          if (Number.isNaN(Date.parse(labels['org.opencontainers.image.created']))) throw new Error('new image created label is invalid');
          NODE
          config_digest="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          if [[ ! "$config_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "New local image config digest is invalid." >&2
            exit 1
          fi
          echo "config_digest=$config_digest" >> "$GITHUB_OUTPUT"

      - name: Pull existing immutable image for runtime validation
        if: ${{ steps.existence.outputs.exists == 'true' }}
        run: docker pull "${{ steps.existing.outputs.immutable_ref }}"

      - name: Validate existing production runtime
        if: ${{ steps.existence.outputs.exists == 'true' }}
        env:
          PRODUCTION_IMAGE_UNDER_TEST: ${{ steps.existing.outputs.immutable_ref }}
        run: node --test test/production/production-image.test.cjs

      - name: Validate new production runtime
        if: ${{ steps.existence.outputs.exists == 'false' }}
        env:
          PRODUCTION_IMAGE_UNDER_TEST: ${{ env.IMAGE_REF }}
        run: node --test test/production/production-image.test.cjs

      - name: Scan new local image
        if: ${{ steps.existence.outputs.exists == 'false' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          scanners: vuln
          severity: CRITICAL
          version: v0.70.0
          cache: false

      - name: Push scanned image
        id: push
        if: ${{ steps.existence.outputs.exists == 'false' }}
        shell: bash
        env:
          EXPECTED_LOCAL_CONFIG_DIGEST: ${{ steps.local.outputs.config_digest }}
        run: |
          set -euo pipefail
          current_config_digest="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          if [ "$current_config_digest" != "$EXPECTED_LOCAL_CONFIG_DIGEST" ]; then
            echo "Local image identity changed after runtime validation and Trivy." >&2
            exit 1
          fi
          docker push "$IMAGE_REF" 2>&1 | tee "${{ runner.temp }}/push-output.txt"
          mapfile -t pushed_digests < <(sed -nE 's/^.*digest: (sha256:[a-f0-9]{64})( size: [0-9]+)?$/\1/p' "${{ runner.temp }}/push-output.txt")
          if [ "${#pushed_digests[@]}" -ne 1 ]; then
            echo "Docker push did not report exactly one canonical manifest digest." >&2
            exit 1
          fi
          pushed_digest="${pushed_digests[0]}"
          immutable_ref="$IMAGE_REPOSITORY@$pushed_digest"
          echo "digest=$pushed_digest" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=$immutable_ref" >> "$GITHUB_OUTPUT"
          echo "config_digest=$current_config_digest" >> "$GITHUB_OUTPUT"

      - name: Select scanned immutable image
        id: selected
        shell: bash
        env:
          TAG_EXISTS: ${{ steps.existence.outputs.exists }}
          EXISTING_IMMUTABLE_REF: ${{ steps.existing.outputs.immutable_ref }}
          EXISTING_CONFIG_DIGEST: ${{ steps.existing.outputs.config_digest }}
          PUSHED_IMMUTABLE_REF: ${{ steps.push.outputs.immutable_ref }}
          PUSHED_CONFIG_DIGEST: ${{ steps.push.outputs.config_digest }}
        run: |
          set -euo pipefail
          if [ "$TAG_EXISTS" = 'true' ]; then
            immutable_ref="$EXISTING_IMMUTABLE_REF"
            config_digest="$EXISTING_CONFIG_DIGEST"
          elif [ "$TAG_EXISTS" = 'false' ]; then
            immutable_ref="$PUSHED_IMMUTABLE_REF"
            config_digest="$PUSHED_CONFIG_DIGEST"
          else
            echo "Immutable tag state is invalid." >&2
            exit 1
          fi
          if [[ ! "$immutable_ref" =~ ^${IMAGE_REPOSITORY}@sha256:[a-f0-9]{64}$ ]]; then
            echo "Selected immutable reference is invalid." >&2
            exit 1
          fi
          if [[ ! "$config_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Selected image config digest is invalid." >&2
            exit 1
          fi
          digest="${immutable_ref##*@}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=$immutable_ref" >> "$GITHUB_OUTPUT"
          echo "config_digest=$config_digest" >> "$GITHUB_OUTPUT"

      - name: Verify scanned immutable image identity
        id: verify
        shell: bash
        env:
          EXPECTED_CONFIG_DIGEST: ${{ steps.selected.outputs.config_digest }}
          EXPECTED_DIGEST: ${{ steps.selected.outputs.digest }}
          IMMUTABLE_REF: ${{ steps.selected.outputs.immutable_ref }}
        run: |
          docker buildx imagetools inspect "$IMMUTABLE_REF" --format '{{json .Manifest}}' > "${{ runner.temp }}/remote-descriptor.json"
          docker buildx imagetools inspect "$IMMUTABLE_REF" --raw > "${{ runner.temp }}/remote-manifest.json"
          docker buildx imagetools inspect "$IMMUTABLE_REF" --format '{{json .Image}}' > "${{ runner.temp }}/remote-image.json"
          REMOTE_DESCRIPTOR_JSON="${{ runner.temp }}/remote-descriptor.json" REMOTE_MANIFEST_JSON="${{ runner.temp }}/remote-manifest.json" REMOTE_IMAGE_JSON="${{ runner.temp }}/remote-image.json" node <<'NODE' > "${{ runner.temp }}/immutable-ref.txt"
          const { readFileSync } = require('node:fs');
          const descriptor = JSON.parse(readFileSync(process.env.REMOTE_DESCRIPTOR_JSON, 'utf8'));
          const manifest = JSON.parse(readFileSync(process.env.REMOTE_MANIFEST_JSON, 'utf8'));
          const image = JSON.parse(readFileSync(process.env.REMOTE_IMAGE_JSON, 'utf8'));
          const labels = image?.config?.Labels ?? {};
          const packageJson = require('./package.json');
          const expected = {
            'org.opencontainers.image.source': `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`,
            'org.opencontainers.image.revision': process.env.GITHUB_SHA,
            'org.opencontainers.image.version': `sha-${process.env.GITHUB_SHA}`,
            'org.opencontainers.image.title': packageJson.name,
            'org.opencontainers.image.description': packageJson.description,
          };
          const manifestDigest = descriptor?.digest ?? '';
          const configDigest = manifest?.config?.digest ?? '';
          if (!/^sha256:[a-f0-9]{64}$/.test(manifestDigest)) throw new Error('remote manifest digest identity is invalid');
          if (!/^sha256:[a-f0-9]{64}$/.test(configDigest)) throw new Error('remote config digest identity is invalid');
          if (manifestDigest !== process.env.EXPECTED_DIGEST) throw new Error('remote manifest digest does not match the scanned immutable image');
          if (configDigest !== process.env.EXPECTED_CONFIG_DIGEST) throw new Error('remote config does not match the scanned local image');
          const immutableReference = process.env.IMMUTABLE_REF;
          if (immutableReference !== `${process.env.IMAGE_REPOSITORY}@${manifestDigest}`) throw new Error('immutable reference does not match the verified digest');
          if (image?.os !== 'linux' || image?.architecture !== 'amd64') throw new Error('remote image platform mismatch');
          for (const [key, value] of Object.entries(expected)) if (labels[key] !== value) throw new Error(`remote image label mismatch: ${key}`);
          if (Number.isNaN(Date.parse(labels['org.opencontainers.image.created']))) throw new Error('remote image created label is invalid');
          process.stdout.write(immutableReference);
          NODE
          immutable_ref="$(tr -d '\r\n' < "${{ runner.temp }}/immutable-ref.txt")"
          echo "immutable_ref=$immutable_ref" >> "$GITHUB_OUTPUT"

      - name: Verify public package linkage and immutable tag
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_DIGEST: ${{ steps.selected.outputs.digest }}
        run: |
          PACKAGE_JSON="${{ runner.temp }}/package.json" VERSIONS_JSON="${{ runner.temp }}/package-versions.json" node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const apiRoot = process.env.GITHUB_API_URL;
          const owner = process.env.GITHUB_REPOSITORY_OWNER;
          const packageName = 'genesis-platform-api';
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          async function request(path) {
            const response = await fetch(`${apiRoot}${path}`, { headers });
            if (!response.ok) {
              const error = new Error(`GitHub Packages API failed closed: ${response.status}`);
              error.status = response.status;
              throw error;
            }
            return response.json();
          }
          const delay = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          async function loadVersions(encoded) {
            const versions = [];
            for (let page = 1; ; page += 1) {
              const batch = await request(`/users/${owner}/packages/container/${encoded}/versions?per_page=100&page=${page}`);
              if (!Array.isArray(batch)) throw new Error('package versions response is invalid');
              versions.push(...batch);
              if (batch.length < 100) break;
            }
            return versions;
          }
          async function main() {
            const encoded = encodeURIComponent(packageName);
            let pkg;
            let versions;
            let matching;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              try {
                pkg = await request(`/users/${owner}/packages/container/${encoded}`);
                versions = await loadVersions(encoded);
                const expectedName = process.env.EXPECTED_DIGEST;
                matching = versions.filter((version) => {
                  const name = String(version?.name ?? '');
                  return name === expectedName || `sha256:${name}` === expectedName;
                });
                if (matching.length === 1) break;
              } catch (error) {
                if (error.status !== 404 || attempt === 6) throw error;
              }
              if (attempt === 6) throw new Error('published manifest is not represented by exactly one package version');
              await delay(5000);
            }
            const linkage = pkg?.repository?.full_name ?? '';
            if (pkg?.package_type !== 'container') throw new Error('package type is not container');
            if (pkg?.visibility !== 'public') throw new Error('package visibility is not public');
            if (linkage !== process.env.GITHUB_REPOSITORY) throw new Error('package repository linkage mismatch');
            const expectedTag = process.env.IMAGE_TAG;
            if (matching.length !== 1) throw new Error('published manifest is not represented by exactly one package version');
            const tags = matching[0]?.metadata?.container?.tags;
            if (!Array.isArray(tags) || tags.length !== 1 || tags[0] !== expectedTag) throw new Error('published version must contain only the expected immutable tag');
            const allTags = versions.flatMap((version) => version?.metadata?.container?.tags ?? []);
            if (allTags.some((tag) => tag === 'latest' || tag === 'main')) throw new Error('mutable latest or main tag is forbidden');
            writeFileSync(process.env.PACKAGE_JSON, `${JSON.stringify(pkg, null, 2)}\n`, { encoding: 'utf8', mode: 0o600 });
            writeFileSync(process.env.VERSIONS_JSON, `${JSON.stringify({ expectedVersionId: matching[0].id, expectedTags: tags, allTags }, null, 2)}\n`, { encoding: 'utf8', mode: 0o600 });
          }
          main().catch((error) => { console.error(error.message); process.exit(1); });
          NODE

      - name: Rescan verified remote immutable image
        id: remote-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.selected.outputs.immutable_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          scanners: vuln
          severity: CRITICAL
          version: v0.70.0
          cache: false

      - name: Generate verified image identity evidence
        id: evidence
        shell: bash
        env:
          MANIFEST_DIGEST: ${{ steps.selected.outputs.digest }}
          CONFIG_DIGEST: ${{ steps.selected.outputs.config_digest }}
          IMMUTABLE_REF: ${{ steps.selected.outputs.immutable_ref }}
        run: |
          REMOTE_IMAGE_JSON="${{ runner.temp }}/remote-image.json" PACKAGE_JSON="${{ runner.temp }}/package.json" VERSIONS_JSON="${{ runner.temp }}/package-versions.json" node <<'NODE'
          const { chmodSync, readFileSync, writeFileSync } = require('node:fs');
          const image = JSON.parse(readFileSync(process.env.REMOTE_IMAGE_JSON, 'utf8'));
          const pkg = JSON.parse(readFileSync(process.env.PACKAGE_JSON, 'utf8'));
          const versions = JSON.parse(readFileSync(process.env.VERSIONS_JSON, 'utf8'));
          const labels = image?.config?.Labels ?? {};
          const identity = {
            repository: process.env.IMAGE_REPOSITORY,
            visibility: pkg.visibility,
            tag: process.env.IMAGE_TAG,
            manifestDigest: process.env.MANIFEST_DIGEST,
            configDigest: process.env.CONFIG_DIGEST,
            immutableReference: process.env.IMMUTABLE_REF,
            commit: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            platform: `${image.os}/${image.architecture}`,
            labels,
            scanner: {
              name: 'Trivy',
              version: '0.70.0',
              scanners: ['vuln'],
              severity: ['CRITICAL'],
              ignoreUnfixed: false,
              exitCode: 1,
            },
            remoteRescan: {
              result: 'passed',
              immutableReference: process.env.IMMUTABLE_REF,
            },
            package: {
              name: pkg.name,
              type: pkg.package_type,
              visibility: pkg.visibility,
              repository: pkg.repository.full_name,
              versionId: versions.expectedVersionId,
              tags: versions.expectedTags,
            },
          };
          writeFileSync('image-identity.json', `${JSON.stringify(identity, null, 2)}\n`, { encoding: 'utf8', mode: 0o600 });
          chmodSync('image-identity.json', 0o600);
          NODE

      - name: Upload immutable image identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-identity-${{ github.sha }}
          path: image-identity.json
          if-no-files-found: error
          retention-days: 14
