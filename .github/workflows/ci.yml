name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Validation mode
        required: true
        type: choice
        default: full
        options:
          - full
          - integrity

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate backend and production contracts
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TEST_DATABASE_HOST: localhost
      TEST_DATABASE_PORT: 5433
      TEST_DATABASE_NAME: genesis_platform_test
      TEST_DATABASE_USER: genesis_test
      TEST_DATABASE_PASSWORD: test-only
      DATABASE_HOST: localhost
      DATABASE_PORT: 5433
      DATABASE_NAME: genesis_platform_test
      DATABASE_USER: genesis_runtime_test
      DATABASE_PASSWORD: runtime-test-only
      DATABASE_RUNTIME_ROLE: genesis_runtime_test
      DATABASE_MIGRATION_USER: genesis_test
      DATABASE_MIGRATION_PASSWORD: test-only
      IMAGE_REF: genesis-platform-api:ci-${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Classify pull request delta
        id: delta
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/ci-surface-classify.cjs --repository api --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --verify-pr-checkout --manifest .codex/task-manifest.json

      - name: Select full manual validation
        id: full
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' }}
        run: node scripts/ci-surface-classify.cjs --repository api --full

      - name: Run main integrity check
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'integrity') }}
        run: node scripts/ci-main-integrity.cjs --repository api --head "${{ github.sha }}"

      - name: Install dependencies for selected surfaces
        if: ${{ steps.delta.outputs.needs_dependencies == 'true' || steps.full.outputs.needs_dependencies == 'true' }}
        run: npm ci

      - name: Validate Tooling surface
        if: ${{ steps.delta.outputs.tooling == 'true' || steps.full.outputs.tooling == 'true' }}
        run: |
          npm run task:contracts
          npm run format:check:task-tools
          npm run test:task-tools
          npm run ci:contract:validate
          npm run format:check:ci
          npm run test:ci

      - name: Validate Memory surface
        if: ${{ steps.delta.outputs.memory == 'true' || steps.full.outputs.memory == 'true' }}
        run: |
          node scripts/validate-project-memory.cjs --mode local
          node --test test/project-memory/project-memory.test.cjs

      - name: Start isolated App database
        if: ${{ steps.delta.outputs.app == 'true' || steps.full.outputs.app == 'true' }}
        run: docker run --detach --rm --name genesis-ci-postgres --health-cmd "pg_isready -U genesis_test -d genesis_platform_test" --health-interval 5s --health-timeout 5s --health-retries 10 --publish 5433:5432 --env POSTGRES_DB=genesis_platform_test --env POSTGRES_USER=genesis_test --env POSTGRES_PASSWORD=test-only postgres:17-alpine

      - name: Wait for isolated App database
        if: ${{ steps.delta.outputs.app == 'true' || steps.full.outputs.app == 'true' }}
        shell: bash
        run: |
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' genesis-ci-postgres)" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs genesis-ci-postgres
          exit 1

      - name: Validate App surface
        if: ${{ steps.delta.outputs.app == 'true' || steps.full.outputs.app == 'true' }}
        run: |
          npm run format:check
          npm run lint
          npm run build
          npm run test -- --runInBand
          npm run test:e2e -- --runInBand
          npm run test:integration

      - name: Stop isolated App database
        if: ${{ always() && (steps.delta.outputs.app == 'true' || steps.full.outputs.app == 'true') }}
        run: docker rm --force genesis-ci-postgres

      - name: Validate ADR-020 active Production surface
        if: ${{ steps.delta.outputs.production == 'true' || steps.full.outputs.production == 'true' }}
        run: |
          npx prettier --check compose.production.yml scripts/validate-production-compose.cjs test/production/functional-proxy-contract.test.cjs test/production/production-compose.test.cjs test/production/production-image.test.cjs test/production/production-runtime.test.cjs test/production/production-secret-wrappers.test.cjs test/production/deploy-api-simple-linux.test.cjs
          node --test test/production/functional-proxy-contract.test.cjs test/production/production-compose.test.cjs test/production/production-image.test.cjs test/production/production-runtime.test.cjs test/production/production-secret-wrappers.test.cjs test/production/deploy-api-simple-linux.test.cjs

      - name: Validate ADR-018 legacy Production surface
        if: ${{ steps.delta.outputs.legacy_production == 'true' }}
        run: node --test test/production/production-bundle.test.cjs test/production/deploy-api-release-linux.test.cjs test/production/release-tree-manager-linux.test.cjs

      - name: Validate Recovery modifier
        if: ${{ steps.delta.outputs.recovery == 'true' || steps.full.outputs.recovery == 'true' }}
        run: |
          npm run format:check:recovery
          npm run recovery:validate
          sudo env "PATH=$PATH" npm run test:recovery
          npm run test:recovery:integration

      - name: Build local production image
        if: ${{ steps.delta.outputs.image_build_scan == 'true' || steps.full.outputs.image_build_scan == 'true' }}
        run: >-
          docker build --target production --tag "$IMAGE_REF"
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          --label "org.opencontainers.image.version=sha-${GITHUB_SHA}" .

      - name: Validate local production image
        if: ${{ steps.delta.outputs.image_build_scan == 'true' || steps.full.outputs.image_build_scan == 'true' }}
        env:
          PRODUCTION_IMAGE_UNDER_TEST: ${{ env.IMAGE_REF }}
        run: node --test test/production/production-image.test.cjs

      - name: Verify local image identity
        if: ${{ steps.delta.outputs.image_build_scan == 'true' || steps.full.outputs.image_build_scan == 'true' }}
        shell: bash
        run: |
          docker image inspect "$IMAGE_REF" > "${{ runner.temp }}/local-image.json"
          IMAGE_JSON="${{ runner.temp }}/local-image.json" node -e "const [i]=JSON.parse(require('node:fs').readFileSync(process.env.IMAGE_JSON)); const l=i.Config.Labels; if(i.Os!=='linux'||i.Architecture!=='amd64'||l['org.opencontainers.image.revision']!==process.env.GITHUB_SHA||l['org.opencontainers.image.source']!==process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY) process.exit(1)"

      - name: Scan local production image
        if: ${{ steps.delta.outputs.image_build_scan == 'true' || steps.full.outputs.image_build_scan == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          scanners: vuln
          severity: CRITICAL
          version: v0.70.0
          cache: false
