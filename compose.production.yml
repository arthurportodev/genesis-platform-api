name: genesis

services:
  traefik:
    image: traefik@sha256:652929a140a32d7cafafb13c6cdfab5376cfeff800f51397b87b524501ed02a8
    platform: linux/amd64
    restart: unless-stopped
    init: true
    entrypoint: ['/bin/sh', '/etc/traefik/render-static-config.sh']
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      TRAEFIK_STATIC_CONFIG: ${TRAEFIK_STATIC_CONFIG:-traefik-internal.yml}
    volumes:
      - ./docker/traefik/render-static-config.sh:/etc/traefik/render-static-config.sh:ro
      - ./docker/traefik/traefik-internal.yml:/etc/traefik/static/traefik-internal.yml:ro
      - ./docker/traefik/traefik-acme-staging.yml:/etc/traefik/static/traefik-acme-staging.yml:ro
      - ./docker/traefik/traefik-acme-production.yml:/etc/traefik/static/traefik-acme-production.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - /opt/genesis/traefik-state:/var/lib/traefik
    tmpfs:
      - /run/traefik:rw,noexec,nosuid,nodev,size=1m,mode=0700
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    cpus: ${TRAEFIK_CPUS:-0.50}
    mem_limit: ${TRAEFIK_MEMORY_LIMIT:-256m}
    pids_limit: ${TRAEFIK_PIDS_LIMIT:-128}
    logging: &rotating-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
      - edge

  postgres:
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
      POSTGRES_USER: ${DATABASE_BOOTSTRAP_USER:?DATABASE_BOOTSTRAP_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      DATABASE_MIGRATION_USER: ${DATABASE_MIGRATION_USER:?DATABASE_MIGRATION_USER is required}
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:?DATABASE_RUNTIME_ROLE is required}
    secrets:
      - postgres_bootstrap_password
      - database_migration_password
      - database_runtime_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-production-roles.sh:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    cpus: ${POSTGRES_CPUS:-1.0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    logging: *rotating-logs
    networks:
      - database

  migrate:
    image: ghcr.io/arthurportodev/genesis-platform-api@sha256:a4dafefab191093ea7547e47ed09783cff2abb67b177cabd09aa07b94ac5797a
    platform: linux/amd64
    restart: 'no'
    init: true
    entrypoint: ['/bin/sh', '/opt/genesis/bin/migrate-entrypoint.sh']
    command:
      [
        'node',
        'node_modules/typeorm/cli.js',
        '-d',
        'dist/database/data-source.js',
        'migration:run',
      ]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=${MIGRATE_NODE_MAX_OLD_SPACE_MB:-640}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is required}
      DATABASE_MIGRATION_USER: ${DATABASE_MIGRATION_USER:?DATABASE_MIGRATION_USER is required}
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:?DATABASE_RUNTIME_ROLE is required}
    group_add: ['70']
    secrets:
      - database_migration_password
    volumes:
      - ./docker/production/migrate-entrypoint.sh:/opt/genesis/bin/migrate-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: ${MIGRATE_CPUS:-0.75}
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-1g}
    pids_limit: ${MIGRATE_PIDS_LIMIT:-128}
    logging: *rotating-logs
    networks:
      - database

  api:
    image: ghcr.io/arthurportodev/genesis-platform-api@sha256:a4dafefab191093ea7547e47ed09783cff2abb67b177cabd09aa07b94ac5797a
    platform: linux/amd64
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    entrypoint: ['/bin/sh', '/opt/genesis/bin/api-entrypoint.sh']
    command: ['node', 'dist/main.js']
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=${API_NODE_MAX_OLD_SPACE_MB:-640}
      PORT: 3000
      APP_NAME: ${APP_NAME:-Genesis Platform API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is required}
      DATABASE_USER: ${DATABASE_RUNTIME_ROLE:?DATABASE_RUNTIME_ROLE is required}
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:?DATABASE_RUNTIME_ROLE is required}
      FRONTEND_URL: https://app.agenciagenesismkt.com.br
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      WEB_PROXY_ATTESTATION_ENABLED: 'false'
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN_DAYS: ${REFRESH_TOKEN_EXPIRES_IN_DAYS:-30}
      API_PUBLIC_REPLICA_COUNT: 1
      INVITATION_ISSUANCE_READINESS: 'false'
      INVITATION_ACCEPTANCE_READINESS: 'false'
      INVITATION_ACTIVATION_READINESS: 'false'
      INVITATION_WORKER_ENABLED: 'false'
      LEAD_FORM_READINESS: 'false'
      LEAD_IDEMPOTENCY_KEY_CURRENT_VERSION: '1'
    group_add: ['70']
    secrets:
      - database_runtime_password
      - jwt_access_secret
      - refresh_token_pepper
      - lead_idempotency_keys
    volumes:
      - ./docker/production/api-entrypoint.sh:/opt/genesis/bin/api-entrypoint.sh:ro
    expose:
      - '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: ${API_CPUS:-0.75}
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    pids_limit: ${API_PIDS_LIMIT:-128}
    logging: *rotating-logs
    networks:
      - database
      - edge

secrets:
  postgres_bootstrap_password:
    file: /opt/genesis/secrets/postgres-bootstrap-password
  database_migration_password:
    file: /opt/genesis/secrets/database-migration-password
  database_runtime_password:
    file: /opt/genesis/secrets/database-runtime-password
  jwt_access_secret:
    file: /opt/genesis/secrets/jwt-access-secret
  refresh_token_pepper:
    file: /opt/genesis/secrets/refresh-token-pepper
  lead_idempotency_keys:
    file: /opt/genesis/secrets/lead-idempotency-keys

volumes:
  postgres_data:
    external: true
    name: genesis-postgres-data

networks:
  database:
    driver: bridge
    internal: true
  edge:
    driver: bridge
